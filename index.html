<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Budget Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #f9f9f8;
  --surface: #ffffff;
  --border: #e8e8e5;
  --border-strong: #d4d4ce;
  --ink: #1a1a18;
  --ink-2: #3d3d3a;
  --muted: #8f8f8a;
  --muted-light: #b8b8b2;
  --green: #1a7f5a;
  --green-bg: #f0faf5;
  --green-border: #c8ead8;
  --red: #c0392b;
  --red-bg: #fdf4f3;
  --red-border: #f0c8c4;
  --yellow: #92600a;
  --yellow-bg: #fdf8ee;
  --yellow-border: #f0dfa0;
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  height: 52px;
  display: flex; align-items: center;
  padding: 0 28px; gap: 32px;
  position: sticky; top: 0; z-index: 100;
}
.logo { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; white-space: nowrap; }
.logo span { color: var(--muted); font-weight: 400; }
.month-nav { display: flex; align-items: center; gap: 8px; margin: 0 auto; }
.month-nav button {
  width: 26px; height: 26px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface);
  color: var(--muted); cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
